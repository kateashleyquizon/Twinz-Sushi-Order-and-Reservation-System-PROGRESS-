{% extends 'twinzsushiapp/base.html' %}
{% block title %}Update Progress | TwinZ Sushi{% endblock %}
{% block content %}

<h2>{{ title }}</h2>

<div class="content-card">
    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn btn-orange">
            Save Status
        </button>

        <a href="{% url back_url %}" class="btn btn-light">
            Cancel
        </a>
    </form>
</div>
{% endblock %}
