{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Employee Login | TwinZ Sushi</title>
    <link rel="stylesheet" href="{% static 'twinzsushiapp/style.css' %}">
</head>
<body class="login-page">

    <div class="login-card">
        <div class="brand-logo">🍣</div>

        <h1>TwinZ Sushi</h1>
        <p>Employee Portal</p>

        <h2>Welcome Back!</h2>
        <p>Sign in to manage orders and reservations.</p>

        <form method="POST">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="btn btn-orange">
                Log In
            </button>
        </form>

        <a href="{% url 'welcome' %}">Back to Welcome Page</a>
    </div>

</body>
</html>
